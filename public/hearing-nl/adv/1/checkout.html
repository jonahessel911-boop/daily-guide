<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/meta-pixel.js"></script>
  <title>HearDirect™ | Comfortabele hoortoestellen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/hearing/hearing-brand.css">
  <link rel="stylesheet" href="../../hearing-dtc-checkout.css">
  <link rel="stylesheet" href="/hearing/hearing-cart.css">
</head>
<body class="dtc-pre" data-track-page="lander" data-track-product="hearing" data-track-country="nl" data-track-lander="adv-1" data-pay-url="pay.html">
  <noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=1545607877104793&amp;ev=PageView&amp;noscript=1" alt="" /></noscript>

  <div class="dtc-promo-bar">Gratis verzending · 90 dagen retour</div>

  <header class="dtc-pre-header">
    <div class="dtc-pre-header__inner">
      <a href="#" class="dtc-pre-header__logo hd-logo" aria-label="HearDirect"><img src="/hearing/assets/heardirect-logo.png" alt="HearDirect" width="120" height="40" decoding="async"></a>
      <button type="button" class="dtc-pre-header__cart" id="hd-cart-open" aria-label="Winkelwagen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6l-1-3H2"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>
        <span class="dtc-pre-header__cart-badge" data-hd-cart-count hidden>0</span>
      </button>
    </div>
  </header>

  <div class="dtc-page">
    <div class="dtc-layout">
      <div class="dtc-col-left" id="dtc-col-left"></div>
      <div class="dtc-col-right" id="dtc-col-right"></div>
    </div>
    <div class="dtc-col-below" id="dtc-col-below"></div>
    <div id="dtc-footer"></div>
  </div>

  <div class="dtc-sticky-atc" id="dtc-mobile-cta">
    <div class="dtc-sticky-atc__price">
      <strong data-checkout-price>€ 129,99</strong>
      <span>HearDirect™</span>
    </div>
    <button type="button" class="dtc-sticky-atc__btn" data-hd-atc>Voeg toe aan winkelwagen</button>
  </div>

  <script src="../../../track.js"></script>
  <script src="../../hearing-dtc-config.js"></script>
  <script src="../../hearing-dtc-ui.js"></script>
  <script src="/hearing/hearing-cart.js"></script>
</body>
</html>
